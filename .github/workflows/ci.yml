name: Verify recovery contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test transaction and recovery boundaries
        run: python -m unittest discover -s tests -v
      - name: Reproduce fault traces
        run: python -m replaylab experiment --output .runtime/reproduced.json
      - name: Compare checked-in results
        run: python -c "import json,pathlib; p=pathlib.Path; assert json.loads(p('results/fault-replay.json').read_text()) == json.loads(p('.runtime/reproduced.json').read_text()), 'result drift'"
